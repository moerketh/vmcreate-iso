search --no-floppy --set=root --file /ubuntu

insmod all_video

set gfxpayload=keep

# Menu hidden; hold Esc or Shift during the 1 s countdown to show it.
set timeout_style=hidden
set timeout=1
set default=0

# Splash: plymouth on the built-in simpledrm (GPU drivers are stripped, and
# plymouthd ignores simpledrm until its device timeout without the flag).
menuentry "VMCreate Deployment ISO" {
linux /casper/vmlinuz boot=casper toram noprompt quiet splash plymouth.use-simpledrm loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 ---
initrd /casper/initrd
}

# Debug: full kernel/systemd console output, no splash.
menuentry "VMCreate Deployment ISO (verbose, no splash)" {
linux /casper/vmlinuz boot=casper toram noprompt plymouth.enable=0 ---
initrd /casper/initrd
}
