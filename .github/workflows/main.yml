name: Build vmcreate ISO

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: jobs inherit contents:read unless they
# declare a narrower/wider block (only the build job writes).
permissions:
  contents: read

jobs:
  # Pin the runner image: the build job bakes the BUILD HOST's signed
  # grub/shim into the ISO (see build.sh), and the verify job asserts
  # systemd-255/noble parity — ubuntu-latest would silently drift both
  # when GitHub migrates the label (26.04 has been announced).
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -S error autorun/*.sh lib/*.sh build.sh chroot_setup.sh initramfs/*

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install BATS
        run: sudo apt-get install -y bats
      - name: Run tests
        run: bats test/

  verify-units:
    # Catches the class of bugs that only show up at boot: unit files are
    # first-class sources here, so systemd itself (255, same as noble)
    # validates them on every push.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: systemd version (noble parity check)
        run: systemctl --version | head -1
      - name: Verify guest units with systemd-analyze
        run: |
          # verify alone catches parse errors and unknown directives; note
          # it exits 0 even when it reports an ordering cycle, so the
          # cycle detection below is a separate, explicit check.
          cp guest/* /tmp/ && cd /tmp
          systemd-analyze verify \
            sshd-vsock.socket \
            sshd-vsock@.service \
            sshd-vsock-keygen.service \
            inject-ssh-key.service || {
              echo "systemd-analyze verify reported errors" >&2
              exit 1
            }
      - name: Fail on ordering cycles in the boot graph
        run: |
          # Verifying units one at a time never pulls in basic.target and
          # sockets.target, so the cycle the old units had could not form.
          # This test-only target drags the boot graph in; units sit in
          # the same directory so verify resolves them.
          cp guest/* /tmp/ && cd /tmp
          printf '[Unit]\nWants=basic.target sockets.target sshd-vsock.socket inject-ssh-key.service\n' > cycle-check.target
          out=$(systemd-analyze verify cycle-check.target *.socket *.service 2>&1 || true)
          echo "$out"
          ! echo "$out" | grep -qi 'ordering cycle'

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test, verify-units]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-efi-amd64-signed shim-signed mtools dosfstools
      - name: Run build script
        run: bash build.sh
      - name: Determine version and filenames
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          ISO_NAME="vmcreate-${VERSION}.iso"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          case "$VERSION" in
            *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
            *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
          esac
      - name: Generate SHA256 checksum
        run: sha256sum ${{ steps.version.outputs.iso_name }} > ${{ steps.version.outputs.iso_name }}.sha256
      - name: Delete old artifacts
        # Only same-name artifacts: runs from branches would otherwise wipe
        # main's uploaded artifact too (the name is the same for every ref).
        if: github.ref_type == 'branch'
        permissions:
          actions: write
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const artifactName = `vmcreate-iso-${{ steps.version.outputs.version }}`;
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name !== artifactName) continue;
              if (artifact.workflow_run?.id === context.runId) continue;
              console.log(`Deleting artifact: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload ISO and checksum as artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmcreate-iso-${{ steps.version.outputs.version }}
          retention-days: 5
          path: |
            ${{ steps.version.outputs.iso_name }}
            ${{ steps.version.outputs.iso_name }}.sha256
      - name: Create release and upload ISO with checksum
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: ${{ steps.version.outputs.iso_name }},${{ steps.version.outputs.iso_name }}.sha256
          prerelease: ${{ steps.version.outputs.prerelease }}
          generateReleaseNotes: false
