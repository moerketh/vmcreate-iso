name: Build vmcreate ISO

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: jobs inherit contents:read unless they
# declare a narrower/wider block (only the build job writes).
permissions:
  contents: read

jobs:
  # Pin the runner image: the build job bakes the BUILD HOST's signed
  # grub/shim into the ISO (see build.sh), and the verify job asserts
  # systemd-255/noble parity — ubuntu-latest would silently drift both
  # when GitHub migrates the label (26.04 has been announced).
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -S error autorun/*.sh lib/*.sh build.sh chroot_setup.sh initramfs/*

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install BATS
        run: sudo apt-get install -y bats
      - name: Run tests
        run: bats test/

  verify-units:
    # Catches the class of bugs that only show up at boot: unit files are
    # first-class sources here, so systemd itself (255, same as noble)
    # validates them on every push.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: systemd version (noble parity check)
        run: systemctl --version | head -1
      - name: Verify guest units with systemd-analyze
        run: |
          # verify alone catches parse errors and unknown directives; note
          # it exits 0 even when it reports an ordering cycle, so the
          # cycle detection below is a separate, explicit check.
          cp guest/* /tmp/ && cd /tmp
          systemd-analyze verify \
            sshd-vsock.socket \
            sshd-vsock@.service \
            sshd-vsock-keygen.service \
            inject-ssh-key.service || {
              echo "systemd-analyze verify reported errors" >&2
              exit 1
            }
      - name: Fail on ordering cycles in the boot graph
        run: |
          # Verifying units one at a time never pulls in basic.target and
          # sockets.target, so the cycle the old units had could not form.
          # This test-only target drags the boot graph in; units sit in
          # the same directory so verify resolves them.
          cp guest/* /tmp/ && cd /tmp
          printf '[Unit]\nWants=basic.target sockets.target sshd-vsock.socket inject-ssh-key.service\n' > cycle-check.target
          out=$(systemd-analyze verify cycle-check.target *.socket *.service 2>&1 || true)
          echo "$out"
          ! echo "$out" | grep -qi 'ordering cycle'


  # ── Release pipeline ────────────────────────────────────────────────
  # build runs debootstrap, a root chroot and hundreds of third-party
  # packages, so it holds no write token and never sees the signing key.
  # It hands the exact ISO bytes on as an artifact; sign-release (tags
  # only, behind the `release` environment's approval) publishes them
  # without checking out or running any build code.
  build:
    runs-on: ubuntu-24.04
    needs: [lint, test, verify-units]
    outputs:
      version: ${{ steps.version.outputs.version }}
      iso_name: ${{ steps.version.outputs.iso_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-efi-amd64-signed shim-signed mtools dosfstools
      - name: Run build script
        run: bash build.sh
      - name: Determine version and filenames
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          ISO_NAME="vmcreate-${VERSION}.iso"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          case "$VERSION" in
            *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
            *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
          esac
          # Tag runs get their own artifact name so cleanup-artifacts (which
          # deletes same-name artifacts of other runs) can never delete an
          # ISO that is still waiting for release approval.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "artifact=vmcreate-iso-${VERSION}-release" >> $GITHUB_OUTPUT
          else
            echo "artifact=vmcreate-iso-${VERSION}" >> $GITHUB_OUTPUT
          fi
      - name: Generate SHA256 checksum
        run: sha256sum ${{ steps.version.outputs.iso_name }} > ${{ steps.version.outputs.iso_name }}.sha256
      - name: Upload ISO and checksum as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          # Tag runs may wait for release approval; keep them long enough.
          retention-days: ${{ github.ref_type == 'tag' && 30 || 5 }}
          if-no-files-found: error
          path: |
            ${{ steps.version.outputs.iso_name }}
            ${{ steps.version.outputs.iso_name }}.sha256

  cleanup-artifacts:
    # Keeps only the newest branch artifact per version. Needs actions:write
    # (job-level: GitHub has no step-level permissions) and runs no repo code.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: write
    steps:
      - name: Delete older same-name artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const artifactName = '${{ needs.build.outputs.artifact }}';
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name !== artifactName) continue;
              if (artifact.workflow_run?.id === context.runId) continue;
              console.log(`Deleting artifact: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

  sign-release:
    # The only job with a write token. The `release` environment requires
    # the maintainer's approval and only admits v* tags; no checkout, no
    # build code — it publishes exactly the bytes the build job produced.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ISO_NAME: ${{ needs.build.outputs.iso_name }}
    steps:
      - name: Tag must match VERSION
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match VERSION $VERSION (want v$VERSION)" >&2
            exit 1
          fi
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Verify checksum of the downloaded ISO
        run: sha256sum -c "$ISO_NAME.sha256"
      - name: Create release and upload ISO with checksum
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: ${{ needs.build.outputs.iso_name }},${{ needs.build.outputs.iso_name }}.sha256
          prerelease: ${{ needs.build.outputs.prerelease }}
          generateReleaseNotes: false
